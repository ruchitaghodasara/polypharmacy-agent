<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypharmacy Safety Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal:  { 50:'#f0faf7', 100:'#d0f0e7', 200:'#a1e1cf', 300:'#62c8ae', 400:'#31a88a', 500:'#0F6E56', 600:'#0c5a46', 700:'#094736', 800:'#063326', 900:'#031a13' },
            crit:  { 50:'#fdf2f2', 100:'#fde0e0', 200:'#fbb5b5', 300:'#f77272', 400:'#e84040', 500:'#A32D2D', 600:'#8a2424', 700:'#6e1b1b', 800:'#521212', 900:'#360a0a' },
            amber: { 50:'#fffbeb', 100:'#fef3c7', 200:'#fde68a', 400:'#fbbf24', 500:'#f59e0b', 600:'#d97706' },
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
    .fade-in { animation: fadeIn .25s ease-in; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .pulse-ring { animation: pulseRing 1.4s ease-in-out infinite; }
    @keyframes pulseRing { 0%,100%{opacity:1;} 50%{opacity:.4;} }
    .slide-in { animation: slideIn .3s ease-out; }
    @keyframes slideIn { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }
    .drop-zone-active { border-color: #0F6E56 !important; background: #f0faf7 !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
